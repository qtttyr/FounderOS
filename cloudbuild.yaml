steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/mira-494609/mira-ai-hub:$COMMIT_SHA', '.']
    dir: 'backend'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/mira-494609/mira-ai-hub:$COMMIT_SHA']
    dir: 'backend'

  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'mira-ai-hub'
      - '--image=gcr.io/mira-494609/mira-ai-hub:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=256Mi'
      - '--cpu=1'
      - '--timeout=60'
      - '--max-instances=1'
      - '--set-env-vars=GEMINI_API_KEY=$_GEMINI_API_KEY'
    dir: 'backend'

substitutions:
  _GEMINI_API_KEY: ''

options:
  logging: CLOUD_LOGGING_ONLY