steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/project-29104ba0-09d7-450d-b36/mira-ai-hub:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/project-29104ba0-09d7-450d-b36/mira-ai-hub:latest'

  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Deploy'
    args:
      - 'run'
      - 'deploy'
      - 'mira-ai-hub'
      - '--image=us-central1-docker.pkg.dev/project-29104ba0-09d7-450d-b36/mira-ai-hub:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=256Mi'
      - '--cpu=1'
      - '--timeout=60'
      - '--max-instances=1'

substitutions:
  _GEMINI_API_KEY: ''